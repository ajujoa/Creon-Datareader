[storage]
# 파일 저장 사용 여부 (true/false)
file_enabled = true
# 파일 저장 형식 (json/csv)
file_format = json
# 파일 저장 기본 경로
file_base_path = ./data
# 파일 압축 사용 여부 (true/false)
file_compression = false
# 파일 인코딩
file_encoding = utf-8
# 데이터베이스 저장 사용 여부 (true/false)
database_enabled = true
# 데이터베이스 종류 (sqlite/postgresql/mariadb)
database_type = sqlite
# 데이터베이스 파일 경로 (SQLite 사용시)
database_path = ./data/database/creon_data.db
# 데이터베이스 호스트 (SQLite 외 사용시)
database_host = localhost
# 데이터베이스 포트
database_port = 3306
# 데이터베이스 이름
database_name = creon
# 데이터베이스 사용자
database_user = creon
# 데이터베이스 비밀번호
database_password = 560762

[collection]
# 기본 수집 데이터 개수
default_count = 1000
# API 요청 실패시 최대 재시도 횟수
max_retries = 3
# 재시도 간 대기 시간 (초)
retry_delay = 1.0
# API 요청 간 대기 시간 (초) - 0.25초 = 초당 4회
request_delay = 0.25
# 한번에 처리할 데이터 묶음 크기
chunk_size = 100
# 수집 데이터 검증 사용 여부 (true/false)
validate_data = true
# OHLCV 무결성 검사 (고가>=저가 등)
check_ohlcv_integrity = true
# 타임스탬프 순서 검사
check_timestamp_order = true
# 데이터 누락 구간 검사
check_for_gaps = true

[merge]
# 이어받기(병합) 기능 사용 여부 (true/false)
enabled = true
# 병합시 과거 데이터 조회 기간 (일)
lookback_days = 3
# 자동 병합 사용 여부 (true/false)
auto_merge = true
# 최대 채울 누락 구간 수
max_gaps_to_fill = 3
# 데이터 충돌시 해결 방식 (newer_source/existing)
conflict_resolution = newer_source
# 저장 전 데이터 검증 여부
validate_before_save = true
# 백업 생성 여부
create_backup = true
# 백업 보관 기간 (일)
backup_retention_days = 30

[filters]
# 최소 주가 (0=사용안함, 단위: 원)
price_min = 1000
# 최대 주가 (0=사용안함, 단위: 원)
price_max = 1000000
# 최소 거래대금 (0=사용안함, 단위: 백만원)
amount_min = 0
# 최대 거래대금 (0=사용안함, 단위: 백만원)
amount_max = 0
# ETF 제외 (true/false)
exclude_etf = true
# ETN 제외 (true/false)
exclude_etn = true
# 상장폐지 종목 제외 (true/false)
exclude_delisted = true
# 종목명에 포함되면 제외할 키워드 목록 (쉼표 구분)
exclude_keywords = KODEX,TIGER,ACE,액티브,KOSEF,ARIRANG,블룸버그,합성,SOL,스팩,HANARO,메리츠
# 수집할 마켓 타입 (KOSPI/KOSDAQ/KONEX/ALL)
market_types = ALL

[logging]
# 로그 레벨 (DEBUG/INFO/WARNING/ERROR)
level = INFO
# 파일 로깅 사용 여부
file_enabled = true
# 로그 파일 저장 경로
file_path = ./logs
# 로그 파일 최대 크기 (bytes) - 10MB
file_max_size = 10485760
# 로그 파일 백업 개수
file_backup_count = 5
# 콘솔 로깅 사용 여부
console_enabled = true
# 성능 메트릭 수집 사용 여부
enable_metrics = true
# 메트릭 서버 포트
metrics_port = 9090

[performance]
# 최대 병렬 작업 수 (종목 수집시)
max_workers = 4
# 멀티프로세싱 사용 여부 (true/false)
use_multiprocessing = false
# 메모리 제한 (MB)
memory_limit_mb = 1024
# 배치 처리 크기
batch_size = 1000
# 캐시 사용 여부
enable_cache = true
# 캐시 유효 시간 (초)
cache_ttl_seconds = 300
# 캐시 최대 크기
cache_max_size = 1000

[database_sqlite]
# 저널 모드 (DELETE/TRUNCATE/PERSIST/MEMORY/WAL)
journal_mode = WAL
# 동기화 모드 (OFF/NORMAL/FULL/EXTRA)
synchronous = NORMAL
# 캐시 크기 (KB, 음수면 페이지 수)
cache_size = -2000.0
# 임시 테이블 저장소 (DEFAULT/FILE/MEMORY)
temp_store = MEMORY
# 메모리 맵 파일 크기 (bytes)
mmap_size = 268435456
# Lock 대기 시간 (ms)
busy_timeout = 5000
# 외래키 제약 사용 여부
foreign_keys = true
# 자동 VACUUM 모드 (NONE/FULL/INCREMENTAL)
auto_vacuum = INCREMENTAL

[database_postgresql]
# PostgreSQL 서버 호스트
host = localhost
# PostgreSQL 서버 포트
port = 5432
# 데이터베이스 이름
database = creon_data
# 데이터베이스 사용자
user = creon_user
# 데이터베이스 비밀번호
password = 
# 커넥션 풀 크기
pool_size = 10
# 커넥션 재사용 간격 (초)
pool_recycle = 3600
# 커넥션 타임아웃 (초)
pool_timeout = 30
# 문자셋
charset = utf8
# SSL 모드 (disable/allow/prefer/require/verify-ca/verify-full)
sslmode = disable

[database_mariadb]
# MariaDB 서버 호스트
host = localhost
# MariaDB 서버 포트
port = 3306
# 데이터베이스 이름
database = creon_data
# 데이터베이스 사용자
user = creon_user
# 데이터베이스 비밀번호
password = 
# 커넥션 풀 크기
pool_size = 10
# 커넥션 재사용 간격 (초)
pool_recycle = 3600
# 커넥션 타임아웃 (초)
pool_timeout = 30
# 문자셋
charset = utf8mb4
# Collation
collation = utf8mb4_unicode_ci
# 압축 사용 여부
use_compression = true

[market_types]
# KOSDAQ 수집 여부
kosdaq = true
# KOSPI 수집 여부
kospi = true
# KONEX 수집 여부
konex = false

[charts]
# 일봉 데이터 수집 사용 여부
daily_enabled = true
# 1분봉 데이터 수집 사용 여부
minute_1_enabled = true
# 3분봉 데이터 수집 사용 여부
minute_3_enabled = true
# 5분봉 데이터 수집 사용 여부
minute_5_enabled = true
# 10분봉 데이터 수집 사용 여부
minute_10_enabled = true
# 15분봉 데이터 수집 사용 여부
minute_15_enabled = true
# 일봉 데이터 보관 기간 (일) - 10년
daily_retention_days = 3650
# 1분봉 데이터 보관 기간 (일) - 서버 보유 2년
minute_1_retention_days = 730
# 3분봉 데이터 보관 기간 (일) - 서버 보유 5년
minute_3_retention_days = 1825
# 5분봉 데이터 보관 기간 (일) - 서버 보유 5년
minute_5_retention_days = 1825
# 10분봉 데이터 보관 기간 (일) - 서버 보유 5년
minute_10_retention_days = 1825
# 15분봉 데이터 보관 기간 (일) - 서버 보유 5년
minute_15_retention_days = 1825

# 분봉별 최대 조회 가능 개수 (약치)
# 구분	서버 보유 기간	하루 생성 개수	최대 조회 가능 개수
# 1분봉	2년 (약 500영업일)	390개	약 195,000개
# 3분봉	5년 (약 1,250영업일)	130개	약 162,500개
# 5분봉	5년 (약 1,250영업일)	78개	약 97,500개
# 10분봉	5년 (약 1,250영업일)	39개	약 48,750개
# 15분봉	5년 (약 1,250영업일)	26개	약 32,500개
max_data_counts = 1:195000,3:162500,5:97500,10:48750,15:32500

[api]
# API 요청 타임아웃 (초)
timeout = 30
# 최대 동시 연결 수
max_connections = 10
# 분당 최대 요청 수 (Creon 제한 준수)
rate_limit_per_minute = 60
# User-Agent
user_agent = CreonDataReader/2.0

[security]
# 데이터베이스 암호화 사용 여부
encrypt_database = false
# 암호화 키 (비워두면 자동 생성)
encryption_key = 
# 감사 로그 사용 여부
enable_audit_log = true
# 감사 로그 저장 경로
audit_log_path = ./logs/audit
# 민감 작업 로깅 여부 (비밀번호 등)
log_sensitive_operations = false

[maintenance]
# 자동 VACUUM 실행 간격 (일)
auto_vacuum_days = 7
# 자동 백업 사용 여부 (true=매일)
auto_backup_days = true
# 오래된 파일 정리 간격 (일)
cleanup_old_files_days = 30
# 데이터 무결성 검사 사용 여부 (true=매일)
check_integrity_days = true
# 데이터베이스 최적화 간격 (일)
optimize_database_days = 30

[notifications]
# 이메일 알림 사용 여부
enable_email = false
# SMTP 서버 주소
smtp_server = 
# SMTP 서버 포트
smtp_port = 587
# SMTP 사용자
smtp_user = 
# SMTP 비밀번호
smtp_password = 
# 수신 이메일 주소
email_to = 
# 텔레그램 알림 사용 여부
enable_telegram = false
# 텔레그램 봇 토큰
telegram_bot_token = 
# 텔레그램 채팅 ID
telegram_chat_id = 

[debug]
# 디버그 모드 사용 여부
enable_debug_mode = false
# SQL 쿼리 로깅 여부
log_sql_queries = false
# API 호출 로깅 여부
log_api_calls = false
# 성능 로깅 여부
log_performance = false
# 프로파일링 사용 여부
profiling_enabled = false
# 프로파일링 결과 출력 경로
profiling_output = ./logs/profiles

[version]
# 프로그램 버전
version = 2.0.0
# 최초 생성일시
created_at = 2026-04-22T10:00:00
# 최종 수정일시
updated_at = 2026-04-22T10:00:00

[created_at]
# 설정 파일 최초 생성 시간
value = 2026-04-22T14:06:21.860937

[updated_at]
