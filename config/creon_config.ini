[storage]
file_enabled = true
file_format = json
file_base_path = ./data
file_compression = false
file_encoding = utf-8
database_enabled = true
database_type = sqlite
database_path = ./data/database/creon_data.db
database_host = localhost
database_port = 3306
database_name = creon
database_user = creon
database_password = 560762

[collection]
default_count = 1000
max_retries = 3
retry_delay = 1.0
request_delay = 0.25
chunk_size = 100
validate_data = true
check_ohlcv_integrity = true
check_timestamp_order = true
check_for_gaps = true

[merge]
enabled = true
lookback_days = 3
auto_merge = true
max_gaps_to_fill = 3
conflict_resolution = newer_source
validate_before_save = true
create_backup = true
backup_retention_days = 30

[filters]
price_min = 10000
price_max = 30000
exclude_etf = true
exclude_etn = true
exclude_delisted = true
exclude_keywords = KODEX,TIGER,ACE,액티브,KOSEF,ARIRANG,블룸버그,합성,SOL,스팩,HANARO,메리츠
market_types = KOSPI

[logging]
level = INFO
file_enabled = true
file_path = ./logs
file_max_size = 10485760
file_backup_count = 5
console_enabled = true
enable_metrics = true
metrics_port = 9090

[performance]
max_workers = 4
use_multiprocessing = false
memory_limit_mb = 1024
batch_size = 1000
enable_cache = true
cache_ttl_seconds = 300
cache_max_size = 1000

[database_sqlite]
journal_mode = WAL
synchronous = NORMAL
cache_size = -2000.0
temp_store = MEMORY
mmap_size = 268435456
busy_timeout = 5000
foreign_keys = true
auto_vacuum = INCREMENTAL

[database_postgresql]
host = localhost
port = 5432
database = creon_data
user = creon_user
password = 
pool_size = 10
pool_recycle = 3600
pool_timeout = 30
charset = utf8
sslmode = disable

[database_mariadb]
host = localhost
port = 3306
database = creon_data
user = creon_user
password = 
pool_size = 10
pool_recycle = 3600
pool_timeout = 30
charset = utf8mb4
collation = utf8mb4_unicode_ci
use_compression = true

[market_types]
kosdaq = true
kospi = true
konex = false

[charts]
daily_enabled = true
minute_1_enabled = true
minute_5_enabled = true
minute_30_enabled = true
minute_60_enabled = true
daily_retention_days = 3650
minute_1_retention_days = 30
minute_5_retention_days = 90
minute_30_retention_days = 180
minute_60_retention_days = 365

[api]
timeout = 30
max_connections = 10
rate_limit_per_minute = 60
user_agent = CreonDataReader/2.0

[security]
encrypt_database = false
encryption_key = 
enable_audit_log = true
audit_log_path = ./logs/audit
log_sensitive_operations = false

[maintenance]
auto_vacuum_days = 7
auto_backup_days = true
cleanup_old_files_days = 30
check_integrity_days = true
optimize_database_days = 30

[notifications]
enable_email = false
smtp_server = 
smtp_port = 587
smtp_user = 
smtp_password = 
email_to = 
enable_telegram = false
telegram_bot_token = 
telegram_chat_id = 

[debug]
enable_debug_mode = false
log_sql_queries = false
log_api_calls = false
log_performance = false
profiling_enabled = false
profiling_output = ./logs/profiles

